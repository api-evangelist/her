aid: her
name: HER
description: 'HER is a dating and community platform built exclusively for queer women, non-binary, and
  trans people, with more than 15 million users across 125+ countries. The app pairs sapphic dating with
  community spaces, events, and richly customizable profiles (pronouns, gender identity, sexual orientation,
  and Pride Pins). Core features are free, with optional HER Premium tiers. HER was surfaced as a portfolio
  company of Initialized Capital and added to the API Evangelist network. It is a consumer mobile
  application and publishes no public developer API, developer portal, or API documentation at this time.'
